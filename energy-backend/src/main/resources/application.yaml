spring:
  datasource:
    url: jdbc:mysql://localhost:3306/energy_db?createDatabaseIfNotExist=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        archive:
          autodetection: none
        mapping-resources:
          - hibernate/User.hbm.xml
          - hibernate/Product.hbm.xml
          - hibernate/ProductItem.hbm.xml
          - hibernate/Task.hbm.xml

server:
  port: 8081
  address: 0.0.0.0


