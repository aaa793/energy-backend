<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ajouter un produit</title>

    <style>
        body {
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #f7f1e3; /* même beige clair */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        form {
            background: white;
            width: 420px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,.15);
        }

        h2 {
            text-align: center;
            color: #000;
            font-size: 26px;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            margin-top: 12px;
            display: block;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 6px;
            border: 1px solid #f6c27a;
        }

        button {
            margin-top: 22px;
            width: 100%;
            padding: 12px;
            background: #f39c12;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #e67e22;
        }
    </style>
</head>

<body>

<div class="container">

    <form th:action="@{/seller/products/save(sellerId=${sellerId})}"
          method="post"
          enctype="multipart/form-data">

        <h2>➕ Ajouter un Produit</h2>

        <label>Nom du produit</label>
        <input type="text" name="name" required>

        <label>Description</label>
        <input type="text" name="description" required>

        <label>Numéro de série</label>
        <input type="text" name="serialNumber" required>

        <label>Prix (DA)</label>
        <input type="number" name="price" step="0.01" required>

        <label>Image du produit</label>
        <input type="file" name="image" accept="image/*" required>

        <button type="submit">💾 Ajouter</button>
    </form>

</div>

</body>
</html>
