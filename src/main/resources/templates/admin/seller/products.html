<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Mes Produits</title>
</head>
<body>
<h2>Liste des produits</h2>

<a th:href="@{/seller/products/new}">Ajouter un nouveau produit</a>
<br/><br/>

<table border="1">
    <tr>
        <th>Nom</th>
        <th>Description</th>
        <th>Numéro de série</th>
        <th>Prix</th>
        <th>Actions</th>
    </tr>
    <tr th:each="item : ${items}">
        <td th:text="${item.product.name}"></td>
        <td th:text="${item.product.description}"></td>
        <td th:text="${item.product.serialNumber}"></td>
        <td th:text="${item.price}"></td>
        <td>
            <a th:href="@{/seller/products/delete/{id}(id=${item.id})}">Supprimer</a>
        </td>
    </tr>
</table>
</body>
</html>
