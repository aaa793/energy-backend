<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Mes Produits</title>

    <style>
        body {
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #f7f1e3; /* beige clair */
            padding: 40px;
        }

        h2 {
            text-align: center;
            color: #000;
            font-size: 34px;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .btn {
            background: #f39c12;
            padding: 10px 18px;
            color: white;
            border-radius: 6px;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 6px 18px rgba(0,0,0,.12);
            border-radius: 10px;
            overflow: hidden;
        }

        th {
            background: #f39c12;
            color: white;
            padding: 14px;
            font-size: 15px;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #f6c27a;
            text-align: center;
            vertical-align: middle;
        }

        img {
            width: 70px;
            height: auto;
            border-radius: 6px;
        }

        /* Réduction description */
        .desc {
            max-width: 260px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin: auto;
        }

        /* Boutons actions */
        .actions {
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .icon-btn {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            text-decoration: none;
            font-size: 16px;
            color: white;
        }

        .edit-btn {
            background: #3498db;
        }

        .delete-btn {
            background: #e74c3c;
        }

        .icon-btn:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

<h2>Mes Produits</h2>

<a class="btn" th:href="@{/seller/products/new(sellerId=${sellerId})}">
    ➕ Nouveau produit
</a>

<table>
    <tr>
        <th>Image</th>
        <th>Nom</th>
        <th>Description</th>
        <th>Numéro</th>
        <th>Prix (DA)</th>
        <th>Actions</th>
    </tr>

    <tr th:each="item : ${items}">
        <td>
            <img th:if="${item.product.imageUrl}"
                 th:src="${item.product.imageUrl}"
                 alt="Produit">
        </td>

        <td th:text="${item.product.name}"></td>

        <td class="desc"
            th:text="${item.product.description}"
            title="Voir description complète">
        </td>

        <td th:text="${item.product.serialNumber}"></td>

        <td th:text="${item.price}"></td>

        <td>
            <div class="actions">
                <a th:href="@{/seller/products/edit/{itemId}(itemId=${item.id}, sellerId=${sellerId})}"
                   class="icon-btn edit-btn"
                   title="Modifier">
                    ✏️
                </a>

                <a th:href="@{/seller/products/delete/{itemId}(itemId=${item.id}, sellerId=${sellerId})}"
                   class="icon-btn delete-btn"
                   title="Supprimer">
                    🗑️
                </a>
            </div>
        </td>
    </tr>
</table>

</body>
</html>
