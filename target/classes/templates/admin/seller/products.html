<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Mes Produits</title>

    <style>
        body {
            font-family: Arial;
            background: #fdebd0;
            padding: 30px;
        }

        h2 {
            color: #e67e22;
        }

        .btn {
            background: #f39c12;
            padding: 10px 16px;
            color: white;
            border-radius: 6px;
            font-weight: bold;
            text-decoration: none;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 0 15px rgba(0,0,0,.1);
        }

        th {
            background: #f39c12;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #f6c27a;
            text-align: center;
        }

        img {
            width: 80px;
            height: auto;
            border-radius: 6px;
        }

        .btn-delete {
            background: #e74c3c;
            padding: 6px 10px;
            color: white;
            border-radius: 6px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<h2>🔆 Mes Produits</h2>

<a class="btn" th:href="@{/seller/products/new(sellerId=${sellerId})}">
    ➕ Nouveau produit
</a>

<table>
    <tr>
        <th>Image</th>
        <th>Nom</th>
        <th>Description</th>
        <th>Numéro</th>
        <th>Prix</th>
        <th>Action</th>
    </tr>

    <tr th:each="item : ${items}">
        <td>
            <img th:if="${item.product.imageUrl}"
                 th:src="@{${item.product.imageUrl}}"
                 alt="Produit">
        </td>

        <td th:text="${item.product.name}"></td>
        <td th:text="${item.product.description}"></td>
        <td th:text="${item.product.serialNumber}"></td>
        <td th:text="${item.price}"></td>

        <td>
            <a class="btn-delete"
               th:href="@{/seller/products/delete/{id}(id=${item.id}, sellerId=${sellerId})}">
                Supprimer
            </a>
        </td>
    </tr>
</table>

</body>
</html>
