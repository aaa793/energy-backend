<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Réinitialiser le mot de passe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #ffe5b4;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            width: 380px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 15px 30px rgba(0,0,0,.2);
            text-align: center;
        }
        h2 { color: #e67e22; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #f6c27a;
            font-size: 14px;
        }
        input:focus { outline: none; border-color: #f39c12; }
        button {
            width: 100%;
            padding: 12px;
            background: #f39c12;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #e67e22; }
        .link { margin-top: 15px; display: block; color: #e67e22; text-decoration: none; font-weight: bold; }
        .link:hover { text-decoration: underline; }
        .success { background: #d4efdf; color: #27ae60; padding: 10px; border-radius: 6px; margin-bottom: 15px; }
        .error { background: #fadbd8; color: #c0392b; padding: 10px; border-radius: 6px; margin-bottom: 15px; }
    </style>
</head>
<body>
<div class="container">
    <h2>🔒 Réinitialiser le mot de passe</h2>

    <div th:if="${error}" class="error" th:text="${error}"></div>
    <div th:if="${success}" class="success" th:text="${success}"></div>

    <form th:action="@{/password/reset}" method="post">
        <!-- Email caché -->
        <input type="hidden" name="email" th:value="${email}"/>

        <!-- Nouveau mot de passe -->
        <input type="password" name="newPassword" placeholder="🔑 Nouveau mot de passe" required/>
        <input type="password" name="confirmPassword" placeholder="🔑 Confirmer mot de passe" required/>

        <button type="submit">Réinitialiser</button>
    </form>

    <a class="link" th:href="@{/admin/login}">Retour à la connexion</a>
</div>
</body>
</html>
