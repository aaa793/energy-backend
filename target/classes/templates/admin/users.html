<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Users</title>

  <style>
    body {
        font-family: Arial;
        background: #fdebd0;
        padding: 30px;
        color: #2c3e50;
    }

    h2 {
        color: #e67e22;
    }

    a { text-decoration: none; }

    .btn {
        padding: 8px 14px;
        border-radius: 6px;
        color: white;
        font-weight: bold;
    }

    .btn-add { background: #f39c12; }
    .btn-edit { background: #ffc100; }
    .btn-delete { background: #e74c3c; }

    table {
        width: 100%;
        background: white;
        border-collapse: collapse;
        margin-top: 20px;
        box-shadow: 0 0 15px rgba(0,0,0,.1);
    }

    th {
        background: #f39c12;
        color: white;
        padding: 12px;
    }

    td {
        padding: 12px;
        border-bottom: 1px solid #f6c27a;
    }

    tr:hover {
        background: #fdebd0;
    }
  </style>
</head>

<body>

<h2>👤 Gestion des utilisateurs</h2>

<a class="btn btn-add" th:href="@{/admin/users/new}">➕ Ajouter</a>

<table>
  <tr>
    <th>ID</th><th>Nom</th><th>Email</th><th>Rôle</th><th>Actions</th>
  </tr>
  <tr th:each="u : ${users}">
    <td th:text="${u.id}"></td>
    <td th:text="${u.firstName + ' ' + u.lastName}"></td>
    <td th:text="${u.email}"></td>
    <td th:text="${u.role}"></td>
    <td>
      <a class="btn btn-edit"
         th:href="@{/admin/users/edit/{id}(id=${u.id})}">✏️</a>
      <a class="btn btn-delete"
         th:href="@{/admin/users/delete/{id}(id=${u.id})}">❌</a>
    </td>
  </tr>
</table>

</body>
</html>
