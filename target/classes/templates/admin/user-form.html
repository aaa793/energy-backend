<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Form</title>

    <style>
        body {
            font-family: Arial;
            background: #fdebd0;
            padding: 40px;
        }

        form {
            background: white;
            width: 420px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,.15);
        }

        h2 {
            color: #e67e22;
        }

        input, select {
            width: 100%;
            padding: 9px;
            margin: 6px 0 12px;
            border-radius: 6px;
            border: 1px solid #f6c27a;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #f39c12;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #e67e22;
        }
    </style>
</head>

<body>

<h2>☀️ Création / Édition utilisateur</h2>

<form th:action="@{/admin/users/save}" th:object="${user}" method="post">
    <input type="hidden" th:field="*{id}"/>

    Prénom:
    <input th:field="*{firstName}"/>

    Nom:
    <input th:field="*{lastName}"/>

    Email:
    <input th:field="*{email}"/>

    Mot de passe:
    <input th:field="*{password}"/>

    Téléphone:
    <input th:field="*{phoneNumber}"/>

    Date de naissance:
    <input type="date" th:field="*{birthDate}"/>

    Rôle:
    <select th:field="*{role}">
        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
    </select>

    <button type="submit">Enregistrer</button>
</form>

</body>
</html>
